<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fffdfa">
  <title>Amplify — Host console</title>
  <link rel="stylesheet" href="/app.css">
  <link rel="stylesheet" href="/board.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><text y='19' font-size='19'>🎛️</text></svg>">
  <style>
    .tabs {
      display: flex;
      gap: 4px;
      padding: 4px;
      background: var(--surface-3);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow-x: auto;
    }
    .tabs button {
      padding: 9px 16px;
      border: 0;
      border-radius: 10px;
      background: transparent;
      color: var(--muted);
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
    }
    .tabs button:hover { color: var(--text); background: rgba(255, 255, 255, 0.7); }
    .tabs button[aria-selected="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow-soft); }
    .tabs .count { color: var(--faint); font-weight: 500; margin-left: 6px; }

    .stat-strip { display: flex; gap: 22px; flex-wrap: wrap; }
    .stat b { display: block; font-family: var(--font-display); font-size: 1.7rem; font-weight: 600; }
    .stat span { color: var(--muted); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; }

    /* --- call sheet ------------------------------------------------- */
    .slot {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      padding: 14px;
      border-radius: var(--radius);
      background: var(--surface);
      border: 1px solid var(--line);
    }
    .slot--empty { border-style: dashed; border-color: rgba(191, 58, 16, 0.5); }
    .slot--resting { border-color: rgba(125, 82, 32, 0.45); background: rgba(226, 178, 121, 0.14); }
    .slot--locked { border-color: rgba(121, 72, 138, 0.45); background: rgba(172, 122, 183, 0.12); }
    @media (min-width: 720px) {
      .slot { grid-template-columns: 130px 1fr 230px; align-items: center; }
    }
    .slot__inst {
      font-size: 0.72rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      font-weight: 700;
      color: var(--faint);
    }
    .slot__name { font-family: var(--font-display); font-size: 1.3rem; font-weight: 600; }
    .slot__name--empty { color: var(--ink-coral); font-weight: 600; font-size: 1.05rem; }
    .slot__why { color: var(--muted); font-size: 0.8rem; margin-top: 2px; }
    .slot select { padding: 9px 11px; font-size: 0.88rem; }

    /* --- roster ----------------------------------------------------- */
    .roster { display: grid; gap: 10px; }
    @media (min-width: 780px) { .roster { grid-template-columns: 1fr 1fr; } }
    .person {
      display: grid;
      gap: 8px;
      padding: 14px 16px;
      border-radius: var(--radius);
      background: var(--surface);
      border: 1px solid var(--line);
    }
    .person--away { opacity: 0.55; }
    .person__top { display: flex; align-items: center; gap: 10px; }
    .person__name { font-family: var(--font-display); font-size: 1.08rem; font-weight: 600; }
    .turns {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 10px;
      border-radius: 999px;
      background: var(--coral);
      border: 1px solid var(--coral);
      color: var(--near-black);
      font-size: 0.76rem;
      font-weight: 700;
    }
    .queue-bar { height: 5px; border-radius: 999px; background: var(--surface-3); overflow: hidden; }
    .queue-bar i { display: block; height: 100%; background: var(--coral); }

    /* --- song list -------------------------------------------------- */
    .song-card {
      display: grid;
      gap: 12px;
      padding: 15px 16px;
      border-radius: var(--radius);
      background: var(--surface);
      border: 1px solid var(--line);
      transition: border-color 0.15s;
    }
    .song-card:hover { border-color: var(--near-black); }
    @media (min-width: 700px) {
      .song-card { grid-template-columns: 1fr auto; align-items: center; }
    }
    .song-card__title { font-family: var(--font-display); font-weight: 600; font-size: 1.15rem; }
    .readiness { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 7px; }

    .share { display: grid; gap: 18px; }
    @media (min-width: 620px) { .share { grid-template-columns: auto 1fr; align-items: start; } }
    .share__qr {
      padding: 10px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      line-height: 0;
    }
    .share__qr svg { display: block; }

    /* Printing the settings page gives you a sign-up card for the stage. */
    @media print {
      body { background: #fff; }
      .tabs, .masthead .btn, .btn { display: none !important; }
      .card { border: 0; box-shadow: none; }
      .share__qr { border: 0; }
    }

    .gate { max-width: 420px; margin: 14vh auto 0; }
  </style>
</head>
<body>
  <main class="shell shell--wide" id="app"></main>
  <div id="overlay"></div>
  <script type="module" src="/js/host.js"></script>
</body>
</html>
