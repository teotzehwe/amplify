<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#faf3e6">
  <title>Amplify — Host console</title>
  <link rel="stylesheet" href="/app.css">
  <link rel="stylesheet" href="/board.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><text y='19' font-size='19'>🎛️</text></svg>">
  <style>
    .tabs {
      display: flex;
      gap: 4px;
      padding: 4px;
      background: var(--surface-3);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow-x: auto;
    }
    .tabs button {
      padding: 9px 16px;
      border: 0;
      border-radius: 10px;
      background: transparent;
      color: var(--muted);
      font-weight: 600;
      font-size: var(--text-sm);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
    }
    .tabs button:hover { color: var(--text); background: rgba(255, 255, 255, 0.7); }
    .tabs button[aria-selected="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow-soft); }
    /* Primary navigation, and 40px by default — under the thumb floor. */
    @media (pointer: coarse) { .tabs button { min-height: 44px; } }
    /* Four tabs plus their counts need ~355px of the 339px a 375px phone
       offers, so Settings was clipped behind a scrollbar. Tightening the
       horizontal padding on narrow screens fits all four without scrolling —
       primary navigation should not need to be discovered by dragging. */
    @media (max-width: 400px) {
      .tabs { padding: 3px; gap: 2px; }
      .tabs button { padding-left: 11px; padding-right: 11px; }
      .tabs .count { margin-left: 4px; }
    }
    /* --muted, not --faint: the tab strip sits on --surface-3, the darkest of
       the paper tones, where --faint measures 4.35:1. It stays quieter than the
       tab label, which is full-strength ink. */
    .tabs .count { color: var(--muted); font-weight: 500; margin-left: 6px; }
    /* Ink on amber, the same pairing the buttons use (5.99:1) — amber as
       text on white would only reach 2.96:1. */
    .tabs .count--alert {
      padding: 1px 7px;
      border-radius: 999px;
      background: var(--amber);
      color: var(--ink);
      font-weight: 700;
      font-size: var(--text-xs);
    }

    .stat-strip { display: flex; gap: 22px; flex-wrap: wrap; }
    .stat b { display: block; font-family: var(--font-display); font-size: var(--text-2xl); font-weight: 600; }
    .stat span { color: var(--muted); font-size: var(--text-xs); text-transform: uppercase; letter-spacing: 0.06em; }

    /* --- the band on stage ------------------------------------------ */
    /* Narrow, the instrument sits above the name and the action shares the
       name's row — stacking all three put a seated musician at ~110px, so a
       five-piece band did not fit on a phone screen the host is working from. */
    .slot {
      display: grid;
      grid-template-columns: 1fr auto;
      grid-template-areas:
        "inst   inst"
        "who    action";
      align-items: center;
      gap: 2px 12px;
      padding: 12px 14px;
      border-radius: var(--radius);
      background: var(--surface);
      border: 1px solid var(--line);
    }
    .slot__inst { grid-area: inst; }
    .slot__who { grid-area: who; min-width: 0; }
    .slot .btn { grid-area: action; }
    .slot--resting { border-color: rgba(162, 89, 4, 0.45); background: rgba(217, 119, 6, 0.14); }
    @media (min-width: 720px) {
      .slot {
        grid-template-columns: 130px 1fr auto;
        grid-template-areas: "inst who action";
        gap: 10px;
        padding: 14px;
      }
    }
    .slot__inst {
      font-size: var(--text-xs);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      font-weight: 700;
      color: var(--faint);
    }
    .slot__name { font-family: var(--font-display); font-size: var(--text-lg); font-weight: 600; }
    .slot__why { color: var(--muted); font-size: var(--text-sm); margin-top: 2px; }
    .slot select { padding: 9px 11px; font-size: var(--text-sm); }
    .slot .btn { justify-self: start; }

    .sub-head {
      font-size: var(--text-xs);
      letter-spacing: 0.16em;
      text-transform: uppercase;
      font-weight: 700;
      color: var(--faint);
    }

    /* --- the sign-up bench ------------------------------------------ */
    /* One tap seats somebody. Everything on the row exists to make that tap
       a fair one: how many turns they have had, when they last played, and
       any cap they set for themselves. */
    .pick-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px 12px;
      align-items: center;
      padding: 11px 14px;
      border-radius: var(--radius);
      background: var(--surface);
      border: 1px solid var(--line);
      transition: border-color 0.15s;
    }
    .pick-row:hover { border-color: var(--line-strong); }
    .pick-row--away { opacity: 0.6; }
    @media (min-width: 640px) {
      .pick-row { grid-template-columns: 1fr auto auto; }
    }
    .pick-row__name { font-family: var(--font-display); font-size: var(--text-md); font-weight: 600; }
    .pick-row__why { color: var(--muted); font-size: var(--text-xs); margin-top: 1px; }
    .pick-row select { padding: 8px 10px; font-size: var(--text-sm); }

    /* Requests waiting on a yes or no. An amber edge, not a red one: this
       needs attention, it is not an error. */
    .card--alert { border-color: rgba(204, 136, 0, 0.55); background: rgba(204, 136, 0, 0.07); }

    /* --- roster ----------------------------------------------------- */
    .roster { display: grid; gap: 10px; }
    @media (min-width: 780px) { .roster { grid-template-columns: 1fr 1fr; } }
    .person {
      display: grid;
      gap: 8px;
      padding: 14px 16px;
      border-radius: var(--radius);
      background: var(--surface);
      border: 1px solid var(--line);
    }
    .person--away { opacity: 0.55; }
    .person__top { display: flex; align-items: center; gap: 10px; }
    .person__name { font-family: var(--font-display); font-size: var(--text-md); font-weight: 600; }
    .turns {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 10px;
      border-radius: 999px;
      background: var(--amber);
      border: 1px solid var(--amber);
      color: var(--ink);
      font-size: var(--text-xs);
      font-weight: 700;
    }
    .queue-bar { height: 5px; border-radius: 999px; background: var(--surface-3); overflow: hidden; }
    .queue-bar i { display: block; height: 100%; background: var(--amber); }

    /* --- song list -------------------------------------------------- */
    .song-card {
      display: grid;
      gap: 12px;
      padding: 15px 16px;
      border-radius: var(--radius);
      background: var(--surface);
      border: 1px solid var(--line);
      transition: border-color 0.15s;
    }
    .song-card:hover { border-color: var(--ink); }
    @media (min-width: 700px) {
      .song-card { grid-template-columns: 1fr auto; align-items: center; }
    }
    .song-card__title { font-family: var(--font-display); font-weight: 600; font-size: var(--text-lg); }
    .song-card--next { border-color: rgba(138, 92, 0, 0.5); background: rgba(204, 136, 0, 0.09); }
    .song-card--played { opacity: 0.6; }
    .song-card--deck { border-color: var(--amber); background: rgba(204, 136, 0, 0.07); opacity: 1; }
    @media (min-width: 700px) {
      /* Queue rows carry reorder arrows, so they run three across. Cards
         without them (the chooser, the request list) keep the two-column
         shape — otherwise the action button inherits the 1fr and stretches
         the width of the card. */
      .song-card { grid-template-columns: auto 1fr auto; }
      .song-card--plain { grid-template-columns: 1fr auto; }
    }
    .queue-move { display: flex; flex-direction: row; gap: 4px; }
    @media (min-width: 700px) { .queue-move { flex-direction: column; } }
    .queue-move .btn { font-size: var(--text-xs); line-height: 1; }
    .readiness { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 7px; }

    .share { display: grid; gap: 18px; }
    @media (min-width: 620px) { .share { grid-template-columns: auto 1fr; align-items: start; } }
    .share__qr {
      padding: 10px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      line-height: 0;
    }
    .share__qr svg { display: block; }

    /* Printing the settings page gives you a sign-up card for the stage. */
    @media print {
      body { background: #fff; }
      .tabs, .masthead .btn, .btn { display: none !important; }
      .card { border: 0; box-shadow: none; }
      .share__qr { border: 0; }
    }

    .gate { max-width: 420px; margin: 14vh auto 0; }
  </style>
</head>
<body>
  <main class="shell shell--wide" id="app"></main>
  <div id="overlay"></div>
  <script type="module" src="/js/host.js"></script>
</body>
</html>
