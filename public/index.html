<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fffdfa">
  <title>Amplify — Jam sign-up</title>
  <link rel="stylesheet" href="/app.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><text y='19' font-size='19'>🎸</text></svg>">
  <style>
    .instrument-line {
      display: grid;
      gap: 8px;
      padding: 12px 0;
      border-bottom: 1px solid var(--line);
    }
    .instrument-line:last-child { border-bottom: 0; }
    @media (min-width: 520px) {
      .instrument-line { grid-template-columns: 1fr 260px; align-items: center; }
    }

    .signup-row {
      display: grid;
      gap: 10px;
      padding: 14px;
      margin-bottom: 8px;
      border-radius: var(--radius);
      background: var(--surface);
      border: 1px solid var(--line);
      transition: border-color 0.15s, background 0.15s;
    }
    .signup-row--in {
      border-color: rgba(65, 97, 111, 0.45);
      background: rgba(152, 178, 191, 0.16);
    }
    .signup-row select { padding: 9px 11px; font-size: 0.88rem; }
    @media (min-width: 480px) {
      .signup-row { grid-template-columns: 1fr auto; align-items: center; }
    }

    .you-card {
      background: var(--cream);
      border: 1px solid rgba(251, 86, 36, 0.35);
    }
    .you-card h2 { font-size: 1.5rem; }
    .you-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 16px; }
    .you-stat b {
      display: block;
      font-family: var(--font-display);
      font-size: 1.9rem;
      font-weight: 600;
    }
    .you-stat span { color: var(--muted); font-size: 0.76rem; text-transform: uppercase; letter-spacing: 0.06em; }

    /* You're on for the next song — the one moment worth shouting in coral. */
    .onstage {
      border: 1px solid var(--coral);
      background: var(--coral);
      color: var(--near-black);
      border-radius: var(--radius-lg);
      padding: 20px;
      animation: pulse-in 0.4s ease-out;
    }
    .onstage .kicker {
      font-family: var(--font-display);
      font-size: 0.8rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      font-weight: 600;
    }
    .onstage .what { font-family: var(--font-display); font-size: 1.8rem; font-weight: 600; margin-top: 4px; }
    .onstage p { color: rgba(11, 9, 9, 0.72); }
    @keyframes pulse-in { from { transform: scale(0.98); opacity: 0; } to { transform: scale(1); opacity: 1; } }

    details.card > summary {
      list-style: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
    }
    details.card > summary::-webkit-details-marker { display: none; }
    details.card > summary::after { content: "▾"; margin-left: auto; color: var(--faint); transition: transform 0.2s; }
    details.card[open] > summary::after { transform: rotate(180deg); }
    details.card > summary + * { margin-top: 16px; }

    .step-num {
      display: inline-grid;
      place-items: center;
      width: 24px; height: 24px;
      border-radius: 50%;
      background: var(--coral);
      color: var(--near-black);
      font-size: 0.78rem;
      font-weight: 700;
      flex: none;
    }
  </style>
</head>
<body>
  <main class="shell" id="app"></main>
  <script type="module" src="/js/player.js"></script>
</body>
</html>
