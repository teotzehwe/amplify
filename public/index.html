<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#faf3e6">
  <title>Amplify — Jam sign-up</title>
  <link rel="stylesheet" href="/app.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><text y='19' font-size='19'>🎸</text></svg>">
  <style>

    .signup-row {
      display: grid;
      gap: 10px;
      padding: 14px;
      margin-bottom: 8px;
      border-radius: var(--radius);
      background: var(--surface);
      border: 1px solid var(--line);
      transition: border-color 0.15s, background 0.15s;
    }
    /* Confirmed, not disabled. The blue-grey wash read as greyed-out against
       warm paper — the wrong feeling for "you're on for this one". The blue
       stays as the semantic edge, but the fill is warm and the title takes the
       accent so the row reads as a positive state. */
    .signup-row--in {
      border-color: rgba(16, 122, 55, 0.5);
      background: linear-gradient(180deg, rgba(22, 163, 74, 0.14), rgba(253, 244, 227, 0.5));
      box-shadow: inset 3px 0 0 var(--ink-success);
    }
    .signup-row--in .song-row__title { color: var(--ink-success); }
    /* Inputs are width:100% globally, which inside this flex row gave the
       select the whole line and bumped Sign up onto its own — about 50px of
       dead height per song, over a setlist that can run to a dozen. */
    .signup-row select {
      width: auto;
      flex: 1 1 110px;
      min-width: 0;
      padding: 9px 11px;
      font-size: var(--text-sm);
    }
    @media (min-width: 480px) {
      .signup-row { grid-template-columns: 1fr auto; align-items: center; }
    }

    .you-card {
      background: var(--cream);
      border: 1px solid rgba(204, 136, 0, 0.35);
    }
    .you-card h2 { font-size: var(--text-xl); }
    .you-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 18px; }
    .you-stat b {
      display: block;
      font-family: var(--font-display);
      font-size: var(--text-2xl);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1;
    }
    /* "Turns tonight" needs 96px in an 88px column. Going smaller would drop
       under 11px and off the scale, and shortening it to "Turns" makes it
       ambiguous against "Songs played" — so both lines get room and every
       label reserves the same two-line box, which aligns the three baselines
       and makes the wrap read as intended rather than cramped. */
    .you-stat span {
      display: block;
      min-height: 2.6em;
      margin-top: 5px;
      color: var(--muted);
      font-size: var(--text-xs);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      line-height: 1.3;
    }

    /* The burnt-orange section.
       Impeccable alternates cream and burnt grounds; this is the page's burnt
       one, and it is the right place for it — being called to play is the
       loudest moment in the app, and the panel is pure display (a kicker, a
       line, a sentence) with no controls, which is what makes a saturated
       ground safe. White text, not ink: ink on burnt is only 3.89:1, white is
       4.56:1. */
    .onstage {
      border: 1px solid var(--burnt);
      background: var(--burnt);
      color: #fff;
      border-radius: var(--radius-lg);
      padding: var(--space-5);
      animation: pulse-in 0.4s ease-out;
    }
    .onstage .kicker {
      font-family: var(--font-display);
      font-size: var(--text-sm);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      font-weight: 600;
    }
    .onstage .what { font-family: var(--font-display); font-size: var(--text-2xl); font-weight: 600; margin-top: 4px; }
    .onstage p { color: #fff; }
    @keyframes pulse-in { from { transform: scale(0.98); opacity: 0; } to { transform: scale(1); opacity: 1; } }

    details.card > summary {
      list-style: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
    }
    details.card > summary::-webkit-details-marker { display: none; }
    details.card > summary::after { content: "▾"; margin-left: auto; color: var(--faint); transition: transform 0.2s; }
    details.card[open] > summary::after { transform: rotate(180deg); }
    details.card > summary + * { margin-top: 16px; }

    .step-num {
      display: inline-grid;
      place-items: center;
      width: 24px; height: 24px;
      border-radius: 50%;
      background: var(--amber);
      color: var(--ink);
      font-size: var(--text-xs);
      font-weight: 700;
      flex: none;
    }
  </style>
</head>
<body>
  <main class="shell" id="app"></main>
  <script type="module" src="/js/player.js"></script>
</body>
</html>
